apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config-eks
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/moel1001/internal-document-platform-.git
    targetRevision: main
    path: observability/grafana

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
