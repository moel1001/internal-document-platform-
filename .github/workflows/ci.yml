name: CI

# run when main is updated, or about to be updated by a PR
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - "app/**"
      - "tests/**"
      - "Dockerfile"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - "app/**"
      - "tests/**"
      - "Dockerfile"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write # write for packages to be able to push images to GHCR

jobs:
  validate-build-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      # pull repo code into the VM
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run secret scan
        run: gitleaks detect --source . --redact --verbose

      # install Python and enable pip dependency caching to speed up CI run
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      # install dependencies from requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pip-audit ruff

      - name: Run dependency vulnerability scan
        run: pip-audit -r app/requirements.txt

      - name: Run Python lint
        run: ruff check app tests

      - name: Check Python formatting
        run: ruff format --check app tests

      - name: Run unit tests
        run: pytest

      # sanity check : python files compile
      - name: Basic check (compile)
        run: python -m compileall app

      - name: Install Hadolint
        env:
          HADOLINT_VERSION: "2.14.0"
        run: |
          curl -sSL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/hadolint
          hadolint --version

      - name: Lint Dockerfile
        run: hadolint Dockerfile

      # login to GHCR, Token automatically created for each worflow run
      - name: Log in to GHCR
        if: github.event_name == 'push'

        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build container image from Dockerfile
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/document-service:${{ github.sha }}

      - name: Run tests inside built image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests:/tests:ro" \
            ghcr.io/${{ github.repository_owner }}/document-service:${{ github.sha }} \
            python -m pytest -o cache_dir=/tmp/.pytest_cache /tests

      - name: Smoke-test built container
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/document-service:${{ github.sha }}"
          docker run -d --name document-service-smoke -p 8000:8000 "$IMAGE"
          trap 'docker rm -f document-service-smoke >/dev/null 2>&1 || true' EXIT

          for _ in {1..30}; do
            if curl -fsS http://localhost:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done

          docker logs document-service-smoke
          exit 1

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/document-service:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          scanners: vuln
          vuln-type: os
          ignore-unfixed: true

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/document-service:${{ github.sha }}

      - name: Verify pushed image digest
        if: github.event_name == 'push'
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/document-service:${{ github.sha }}

      - name: Update Helm values with new image tag
        if: github.event_name == 'push'
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ github.sha }}\"/" helm/document-service/values.yaml

      - name: Set up Helm
        if: github.event_name == 'push'
        uses: azure/setup-helm@v5

      - name: Validate Helm chart
        if: github.event_name == 'push'
        run: |
          helm lint helm/document-service
          helm template helm/document-service > /dev/null

      - name: Commit and push updated Helm values
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/document-service/values.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push
