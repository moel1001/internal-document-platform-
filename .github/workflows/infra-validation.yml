name: Infra Validation

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/infra-validation.yml"
      - ".shellcheckrc"
      - "infra/**"
      - "argocd/**"
      - "helm/platform-values/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/infra-validation.yml"
      - ".shellcheckrc"
      - "infra/**"
      - "argocd/**"
      - "helm/platform-values/**"

permissions:
  contents: read

jobs:
  lint-infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run Bash syntax checks
        run: |
          bash -n infra/apply/*.sh infra/destroy/*.sh infra/script-common.sh

      - name: Run ShellCheck
        run: |
          shellcheck infra/apply/*.sh infra/destroy/*.sh infra/script-common.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infra/terraform validate
