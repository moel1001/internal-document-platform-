name: Infra Validation

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/infra-validation.yml"
      - ".shellcheckrc"
      - "infra/**"
      - "argocd/**"
      - "helm/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/infra-validation.yml"
      - ".shellcheckrc"
      - "infra/**"
      - "argocd/**"
      - "helm/**"

concurrency:
  group: infra-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run secret scan
        run: gitleaks detect --source . --redact --verbose

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run Bash syntax checks
        run: |
          bash -n infra/apply/*.sh infra/destroy/*.sh infra/script-common.sh

      - name: Run ShellCheck
        run: |
          shellcheck infra/apply/*.sh infra/destroy/*.sh infra/script-common.sh

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Validate document-service Helm chart
        run: |
          helm lint helm/document-service
          helm template helm/document-service > /dev/null
          helm template helm/document-service -f helm/document-service/values-eks.yaml > /dev/null

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f) }' helm/platform-values/*.yaml argocd/*.yaml

      - name: Add platform Helm repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update prometheus-community grafana

      - name: Validate platform Helm values
        run: |
          helm template monitoring prometheus-community/kube-prometheus-stack --version 80.14.4 -f helm/platform-values/kube-prometheus-stack-values.yaml > /dev/null
          helm template monitoring-eks prometheus-community/kube-prometheus-stack --version 80.14.4 -f helm/platform-values/kube-prometheus-stack-values.yaml -f helm/platform-values/kube-prometheus-stack-values-eks.yaml > /dev/null
          helm template loki grafana/loki-stack --version 2.10.3 -f helm/platform-values/loki-values.yaml > /dev/null
          helm template loki-eks grafana/loki-stack --version 2.10.3 -f helm/platform-values/loki-values.yaml -f helm/platform-values/loki-values-eks.yaml > /dev/null

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.8.0"
        run: |
          curl -sSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Render manifests for Kubernetes schema validation
        run: |
          mkdir -p /tmp/rendered-manifests

          helm template document-service helm/document-service > /tmp/rendered-manifests/document-service.yaml
          helm template document-service-eks helm/document-service -f helm/document-service/values-eks.yaml > /tmp/rendered-manifests/document-service-eks.yaml
          helm template monitoring prometheus-community/kube-prometheus-stack --version 80.14.4 -f helm/platform-values/kube-prometheus-stack-values.yaml > /tmp/rendered-manifests/monitoring.yaml
          helm template monitoring-eks prometheus-community/kube-prometheus-stack --version 80.14.4 -f helm/platform-values/kube-prometheus-stack-values.yaml -f helm/platform-values/kube-prometheus-stack-values-eks.yaml > /tmp/rendered-manifests/monitoring-eks.yaml
          helm template loki grafana/loki-stack --version 2.10.3 -f helm/platform-values/loki-values.yaml > /tmp/rendered-manifests/loki.yaml
          helm template loki-eks grafana/loki-stack --version 2.10.3 -f helm/platform-values/loki-values.yaml -f helm/platform-values/loki-values-eks.yaml > /tmp/rendered-manifests/loki-eks.yaml

      - name: Validate rendered Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            /tmp/rendered-manifests/*.yaml

      - name: Validate raw Argo CD manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd/*.yaml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infra/terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.63.1
          cache: true

      - name: Run TFLint
        run: |
          cd infra/terraform
          tflint --init
          tflint -f compact

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.71.1"
        run: |
          curl -sSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Run Trivy Terraform config scan
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --tf-vars infra/terraform/terraform.tfvars.example \
            --tf-exclude-downloaded-modules \
            --skip-dirs infra/terraform/.terraform/modules/eks/examples \
            infra/terraform
