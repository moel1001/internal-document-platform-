name: Docs Validation

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/docs-validation.yml"
      - "README.md"
      - "docs/**"
      - "infra/README.md"
      - "deploy/local/README.md"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/docs-validation.yml"
      - "README.md"
      - "docs/**"
      - "infra/README.md"
      - "deploy/local/README.md"

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --exclude "^http://localhost(:[0-9]+)?/"
            --exclude "^https?://[^/]+\.local(/.*)?$"
            --exclude "^https://img\.shields\.io/"
            README.md
            "docs/**/*.md"
            infra/README.md
            deploy/local/README.md
